<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso Simulador | IPN</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body>

  <div class="login-box">
    <div class="mb-6 flex justify-center">
        <!-- Puedes poner un logo del IPN aquí -->
        <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center text-ipnGuinda text-2xl">
            <img src="img/escudo_cecyt_3.png" alt="Logo CECyT 14" />
        </div>
    </div>
    
    <span class="welcome-text">Proceso de Admisión</span>
    <h1>Examen Diagnóstico</h1>
    <p class="subtitle">Ingresa tus credenciales para comenzar</p>
    
    <div class="input-group">
        <input type="text" id="boleta" placeholder="Número de Boleta" autocomplete="off" />
    </div>
    
    <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="off" />
    </div>

    <button id="loginBtn" type="button">INGRESAR A LA PLATAFORMA</button>
    
    <p id="message" aria-live="polite"></p>
  </div>

  <script src="js/inicio.js"> </script>
</body>
</html>
