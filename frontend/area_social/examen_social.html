<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador IPN - Ciencias Sociales</title>
    
    <!-- Tailwind CSS y FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="social.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ipnGuinda: '#6c1d45',
                        ipnGuindaClaro: '#8a2558',
                        ipnAmarillo: '#eab308' // Para "Marcar para revisar"
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen flex flex-col bg-gray-50 overflow-hidden">

    <!-- HEADER: Seguridad y Tiempo -->
    <header class="w-full bg-white shadow-sm flex items-center justify-between px-4 md:px-8 py-3 z-20 shrink-0">

        <div class="flex items-center gap-2 text-sm md:text-base font-bold text-red-500 bg-red-50 px-3 py-1 rounded-full border border-red-200" title="Si cambias de pestaña, recibirás una advertencia.">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Advertencias: <span id="contador-advertencias">0</span>/3</span>
        </div>

        <div class="flex items-center text-ipnGuinda font-black text-xl md:text-2xl bg-gray-100 px-4 py-1 rounded-lg border-2 border-gray-200">
            <i class="far fa-clock mr-2"></i>
            <span id="reloj-global">00:00:00</span>
        </div>
    </header>

    <!-- MAIN: Las 3 Columnas Dinámicas -->
    <main class="flex-1 flex overflow-hidden relative min-h-0">

        <!-- COLUMNA 1: Lectura de Comprensión -->
        <aside id="panel-lectura" class="hidden flex flex-col w-full md:w-1/3 lg:w-1/4 bg-blue-50 border-r border-blue-200 z-50 fixed inset-0 md:relative md:inset-auto md:z-30 transition-transform transform -translate-x-full md:translate-x-0">
            <div class="bg-blue-600 text-white p-3 font-bold flex justify-between items-center shrink-0">
                <span><i class="fas fa-book-open mr-2"></i> Lee el texto y responde los reactivos del 1 al 5.</span>
                <button class="md:hidden text-white hover:text-gray-200 text-xl px-2" onclick="document.getElementById('panel-lectura').classList.add('-translate-x-full')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto flex-1 text-gray-800 text-base leading-relaxed text-justify" id="texto-lectura-contenedor">
                Cargando lectura...
            </div>
        </aside>

        <!-- COLUMNA 2: Área de la Pregunta -->
        <section class="flex-1 flex flex-col bg-white overflow-y-auto overflow-x-hidden relative p-4 md:p-8">
            
            <div class="mb-4 flex flex-wrap justify-between items-center gap-2 shrink-0">
                <span id="etiqueta-materia" class="text-xs font-bold uppercase tracking-wider text-ipnGuinda bg-pink-100 px-3 py-1 rounded-full border border-pink-200">
                    Cargando Materia...
                </span>
                
                <div class="flex items-center gap-2 text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-200" title="Preguntas contestadas">
                    <i class="fas fa-tasks"></i>
                    <span>Contestadas: <span id="contador-contestadas">0</span>/<span id="total-preguntas">0</span></span>
                </div>
            </div>

            <h2 id="texto-pregunta" class="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-snug shrink-0">
                <!-- Pregunta -->
            </h2>

            <div id="contenedor-imagen" class="w-full max-w-lg mx-auto mb-6 hidden shrink-0">
                <img id="imagen-pregunta" src="" alt="Imagen de apoyo" class="w-full h-auto max-h-[40vh] object-contain rounded-xl shadow-md border border-gray-200 cursor-zoom-in">
            </div>

            <div id="contenedor-opciones" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 mt-auto shrink-0">
                <!-- Opciones -->
            </div>

            <footer class="mt-auto border-t border-gray-100 pt-4 flex flex-wrap gap-3 justify-between items-center shrink-0">
                <button id="btn-anterior" class="px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition flex items-center">
                    <i class="fas fa-chevron-left mr-2"></i> Anterior
                </button>
                
                <button id="btn-revisar" class="px-6 py-3 bg-yellow-100 text-yellow-700 font-bold rounded-xl hover:bg-yellow-200 transition border border-yellow-300 flex items-center">
                    <i class="fas fa-flag mr-2"></i> Marcar
                </button>

                <button id="btn-siguiente" class="px-6 py-3 bg-ipnGuinda text-white font-bold rounded-xl hover:bg-ipnGuindaClaro transition shadow-md flex items-center">
                    Siguiente <i class="fas fa-chevron-right ml-2"></i>
                </button>
            </footer>
        </section>

        <!-- COLUMNA 3: Mapa del Examen -->
        <aside id="panel-mapa" class="flex flex-col w-full lg:w-64 bg-gray-100 border-l border-gray-200 z-50 fixed inset-0 lg:relative lg:inset-auto lg:z-30 transition-transform transform translate-x-full lg:translate-x-0">
            <div class="bg-gray-800 text-white p-3 font-bold text-center flex justify-between items-center shrink-0">
                <span><i class="fas fa-th mr-2"></i> Mapa de Reactivos</span>
                <button class="lg:hidden text-white hover:text-gray-300 text-xl px-2" onclick="document.getElementById('panel-mapa').classList.add('translate-x-full')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1">
                <div id="cuadricula-mapa" class="grid grid-cols-4 gap-2">
                    <!-- Mapa dinámico -->
                </div>
            </div>
            
            <div class="p-4 bg-white border-t border-gray-200 shrink-0 flex flex-col gap-2">
                <!-- BOTÓN DE GUARDADO MANUAL -->
                <button id="btn-guardar-progreso" class="w-full py-2 bg-blue-100 text-blue-800 border border-blue-300 font-bold rounded-xl hover:bg-blue-200 transition flex justify-center items-center gap-2">
                    <i class="fas fa-cloud-upload-alt"></i> Guardar Progreso
                </button>

                <button id="btn-finalizar" class="w-full py-3 bg-gray-800 text-white font-bold rounded-xl hover:bg-black transition shadow-md">
                    TERMINAR SECCIÓN
                </button>
            </div>
        </aside>

    </main>

    <!-- Botones Flotantes (Móvil) -->
    <div class="lg:hidden fixed bottom-6 right-4 flex flex-col gap-3 z-40">
        <button id="fab-lectura" class="hidden w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center text-xl hover:scale-110 transition" onclick="document.getElementById('panel-lectura').classList.remove('-translate-x-full')">
            <i class="fas fa-book-open"></i>
        </button>
        <button class="w-14 h-14 bg-gray-800 text-white rounded-full shadow-xl flex items-center justify-center text-xl hover:scale-110 transition" onclick="document.getElementById('panel-mapa').classList.remove('translate-x-full')">
            <i class="fas fa-th"></i>
        </button>
    </div>

    <!-- Scripts -->
    <script src="reactivos_sociales.js"></script>
    <script src="motor_social.js"></script>
    <script src="seguridad_social.js"></script>
    <script src="../js/sesion.js"></script>

</body>
</html>
